<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C768"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#9E7F30"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A3F6E"/>
      <stop offset="100%" stop-color="#1B2A4A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Aura / Halo ring -->
  <circle cx="50" cy="34" r="22" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" opacity="0.85"/>
  <circle cx="50" cy="34" r="24.5" fill="none" stroke="url(#goldGrad)" stroke-width="0.7" stroke-dasharray="2,3" opacity="0.6"/>

  <!-- 12 Stars of the Crown (Apoc 12,1) -->
  <g fill="url(#goldGrad)" filter="url(#glow)">
    <!-- 12 stars around (cx=50, cy=34, r=22) -->
    <path transform="translate(50, 12) scale(0.7)" d="M0,-3 L0.8,-0.8 L3,0 L0.8,0.8 L0,3 L-0.8,0.8 L-3,0 L-0.8,-0.8 Z"/>
    <path transform="translate(61, 15) scale(0.7)" d="M0,-3 L0.8,-0.8 L3,0 L0.8,0.8 L0,3 L-0.8,0.8 L-3,0 L-0.8,-0.8 Z"/>
    <path transform="translate(69.5, 23) scale(0.7)" d="M0,-3 L0.8,-0.8 L3,0 L0.8,0.8 L0,3 L-0.8,0.8 L-3,0 L-0.8,-0.8 Z"/>
    <path transform="translate(72, 34) scale(0.7)" d="M0,-3 L0.8,-0.8 L3,0 L0.8,0.8 L0,3 L-0.8,0.8 L-3,0 L-0.8,-0.8 Z"/>
    <path transform="translate(69.5, 45) scale(0.7)" d="M0,-3 L0.8,-0.8 L3,0 L0.8,0.8 L0,3 L-0.8,0.8 L-3,0 L-0.8,-0.8 Z"/>
    <path transform="translate(61, 53) scale(0.7)" d="M0,-3 L0.8,-0.8 L3,0 L0.8,0.8 L0,3 L-0.8,0.8 L-3,0 L-0.8,-0.8 Z"/>
    <path transform="translate(39, 15) scale(0.7)" d="M0,-3 L0.8,-0.8 L3,0 L0.8,0.8 L0,3 L-0.8,0.8 L-3,0 L-0.8,-0.8 Z"/>
    <path transform="translate(30.5, 23) scale(0.7)" d="M0,-3 L0.8,-0.8 L3,0 L0.8,0.8 L0,3 L-0.8,0.8 L-3,0 L-0.8,-0.8 Z"/>
    <path transform="translate(28, 34) scale(0.7)" d="M0,-3 L0.8,-0.8 L3,0 L0.8,0.8 L0,3 L-0.8,0.8 L-3,0 L-0.8,-0.8 Z"/>
    <path transform="translate(30.5, 45) scale(0.7)" d="M0,-3 L0.8,-0.8 L3,0 L0.8,0.8 L0,3 L-0.8,0.8 L-3,0 L-0.8,-0.8 Z"/>
    <path transform="translate(39, 53) scale(0.7)" d="M0,-3 L0.8,-0.8 L3,0 L0.8,0.8 L0,3 L-0.8,0.8 L-3,0 L-0.8,-0.8 Z"/>
    <path transform="translate(50, 56) scale(0.7)" d="M0,-3 L0.8,-0.8 L3,0 L0.8,0.8 L0,3 L-0.8,0.8 L-3,0 L-0.8,-0.8 Z"/>
  </g>

  <!-- Radiant Light rays behind head -->
  <path d="M50,15 L50,8 M50,53 L50,60 M24,34 L17,34 M76,34 L83,34 M32,18 L27,13 M68,18 L73,13" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>

  <!-- Mantle & Robe (Flowing Silhouette of Our Lady) -->
  <!-- Outer Blue Mantle -->
  <path d="M50,22 
           C43,22 36,29 35,39 
           C34,50 31,68 25,84 
           C23,89 25,93 30,94 
           C36,95 44,96 50,96 
           C56,96 64,95 70,94 
           C75,93 77,89 75,84 
           C69,68 66,50 65,39 
           C64,29 57,22 50,22 Z" 
        fill="url(#blueGrad)"/>

  <!-- Inner Tunic (White/Ecru with gold trim) -->
  <path d="M50,27 
           C46,27 43,32 43,39 
           C43,51 44,70 41,88 
           C44,89 50,90 50,90 
           C50,90 56,89 59,88 
           C56,70 57,51 57,39 
           C57,32 54,27 50,27 Z" 
        fill="#FAF8F5"/>

  <!-- Mantle Golden Border / Lapel -->
  <path d="M50,23 C44,23 37,30 36,40 C35,52 32,71 27,87" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <path d="M50,23 C56,23 63,30 64,40 C65,52 68,71 73,87" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>

  <!-- Head / Veil -->
  <ellipse cx="50" cy="33.5" rx="5.5" ry="7" fill="#F8F3EA"/>
  <path d="M44.5,33 C44.5,27 47,24 50,24 C53,24 55.5,27 55.5,33 C55,30 52.5,29 50,29 C47.5,29 45,30 44.5,33 Z" fill="#E6D3B3"/>

  <!-- Hands in Prayer (Folded at chest) -->
  <path d="M47,48 C48,44 49,43 50,42 C51,43 52,44 53,48 C51.5,49.5 48.5,49.5 47,48 Z" fill="#F8E5CE"/>
  <path d="M49,45 L50,42 L51,45" fill="none" stroke="url(#goldGrad)" stroke-width="0.8"/>
  <!-- Gold sash / belt around waist -->
  <path d="M44,54 Q50,56 56,54" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <path d="M50,55 L49,66" stroke="url(#goldGrad)" stroke-width="1.2"/>

  <!-- Crescent Moon at feet (classic Immaculate Conception icon) -->
  <path d="M22,96 
           C32,104 68,104 78,96 
           C68,101 32,101 22,96 Z" 
        fill="url(#goldGrad)"/>

  <!-- Subtle clouds at base -->
  <path d="M30,102 C34,98 40,99 43,102 C47,99 53,99 57,102 C60,99 66,98 70,102 C63,105 37,105 30,102 Z" fill="#EAE5DC" opacity="0.75"/>
</svg>
